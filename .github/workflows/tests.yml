name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov

      - name: Composer-Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist

      - name: Tests mit Coverage ausführen
        run: vendor/bin/phpunit --coverage-text --colors=never