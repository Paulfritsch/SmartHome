name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3
          coverage: xdebug

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP syntax check
        run: find prototype/src tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run unit tests
        run: |
          mkdir -p build
          vendor/bin/phpunit --coverage-text --testdox-text build/php-tests.txt --log-junit build/phpunit-junit.xml

      - name: Test website prototype
        run: |
          mkdir -p build
          set -o pipefail
          node --test --test-reporter=spec tests/js/builder.test.js tests/js/html.test.js | tee build/js-tests.txt

      # Alle Tests mit Namen direkt auf der Seite des Durchlaufs (Reiter "Summary")
      - name: Show test results in the summary
        if: always()
        run: |
          {
            echo "## PHP-Tests (PHPUnit)"
            echo '```'
            cat build/php-tests.txt 2>/dev/null || echo "Keine Ergebnisse"
            echo '```'
            echo "## Website-Tests (Node)"
            echo '```'
            cat build/js-tests.txt 2>/dev/null || echo "Keine Ergebnisse"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Berichte zum Herunterladen (JUnit-XML und Textliste)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/
